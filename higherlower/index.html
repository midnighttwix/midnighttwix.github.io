<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher or Lower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Come On Down!</p>
            <h1 class="bold-title">HIGHER or LOWER</h1>
          </div>
          <button id="give-up-btn" class="ghost-btn hidden" type="button">Give Up</button>
        </div>

        <p id="status-message" class="status-message">Loading a Pok&eacute;mon...</p>

        <div id="game-view" class="game-view hidden">
          <div class="pokemon-display">
            <img id="pokemon-img" class="pokemon-img" src="" alt="" />
            <p id="pokemon-name" class="pokemon-name"></p>
          </div>

          <p class="prompt-label">
            What is <span id="prompt-name" class="prompt-name"></span>'s
            <span id="stat-label" class="stat-label"></span>?
          </p>

          <div id="guess-row" class="guess-row">
            <input id="guess-input" type="number" placeholder="Enter a number" autocomplete="off" />
            <button id="submit-guess-btn" class="primary-btn" type="button">Guess</button>
          </div>

          <p id="feedback-message" class="feedback-message"></p>

          <div id="guess-history" class="guess-history"></div>

          <div id="reveal-card" class="reveal-card hidden">
            <p id="reveal-message" class="reveal-message"></p>
            <button id="new-round-btn" class="primary-btn" type="button">New Round</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js?v=1"></script>
  </body>
</html>
