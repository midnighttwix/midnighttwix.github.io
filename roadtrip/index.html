<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Road Trip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="back-link" href="../">&larr; Zane Games</a>
        <h1>Road Trip</h1>
        <p class="tagline">How many miles apart are A and B? Get within 100.</p>
      </header>

      <div class="dashboard">
        <div class="gauge">
          <p class="gauge-label">Correct</p>
          <p id="score-display" class="gauge-value">0 / 3</p>
        </div>
        <div class="gauge">
          <p class="gauge-label">Attempts</p>
          <p id="attempts-display" class="gauge-value">0</p>
        </div>
        <div class="gauge gauge-wide">
          <p class="gauge-label">Status</p>
          <p id="status-display" class="gauge-value status-ok">Make your call</p>
        </div>
      </div>

      <div class="map-frame">
        <svg
          id="map"
          viewBox="0 0 1000 620"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="Map of the contiguous United States with two marked cities"
        >
          <g id="states"></g>
          <g id="route"></g>
          <g id="pins"></g>
        </svg>
      </div>

      <div class="legend">
        <span class="legend-item"><span class="legend-dot dot-a">A</span><span id="city-a">&mdash;</span></span>
        <span class="legend-item"><span class="legend-dot dot-b">B</span><span id="city-b">&mdash;</span></span>
      </div>

      <form id="guess-form" class="guess-bar" autocomplete="off">
        <label class="guess-label" for="guess-input">Distance</label>
        <div class="guess-input-wrap">
          <input
            id="guess-input"
            type="number"
            inputmode="numeric"
            min="0"
            max="4000"
            step="1"
            placeholder="000"
          />
          <span class="unit">mi</span>
        </div>
        <button id="guess-btn" class="btn btn-go" type="submit">Check</button>
      </form>

      <p id="result" class="result" role="status" aria-live="polite"></p>

      <div id="penalty" class="penalty hidden">
        <p class="penalty-label">Penalty &mdash; next pair in</p>
        <p id="penalty-count" class="penalty-count">10</p>
      </div>

      <div id="win-screen" class="win-screen hidden">
        <h2>You Win</h2>
        <p id="win-note" class="win-note"></p>
        <div class="win-actions">
          <button id="play-again" class="btn btn-go" type="button">Play Again</button>
          <a class="btn btn-ghost" href="../">Back To Games</a>
        </div>
      </div>
    </div>

    <script src="mapdata.js?v=1"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
