<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Roulette</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <div id="page-bg" class="page-bg"></div>
    <main class="app">
      <section class="panel travel-panel">
        <div class="passport-header">
          <div class="passport-mark">
            <span class="passport-mark-inner">✈</span>
          </div>
          <div>
            <h1 class="bold-title">World Roulette</h1>
            <p class="header-subtitle">Guess the weather or the time.</p>
          </div>
          <button id="randomize-btn" class="primary-btn" type="button">Randomize</button>
        </div>

        <div class="mode-toggle" aria-label="Choose challenge mode">
          <button type="button" class="mode-btn active" data-mode="weather">Weather</button>
          <button type="button" class="mode-btn" data-mode="time">Time</button>
        </div>

        <p id="status-message" class="status-message">Pick a challenge and spin the world.</p>

        <div id="place-card" class="place-card hidden">
          <div class="place-photo-wrap">
            <img id="place-photo" class="place-photo" src="" alt="" />
            <div class="photo-overlay">
              <p id="place-region" class="place-region"></p>
              <h2 id="place-name" class="place-name"></h2>
              <div class="time-badge">
                <span class="time-badge-label">Local time</span>
                <p id="place-time" class="place-time"></p>
              </div>
            </div>
          </div>

          <div class="weather-row">
            <span id="weather-emoji" class="weather-emoji"></span>
            <div class="weather-info">
              <p id="weather-condition" class="weather-condition"></p>
              <p id="weather-temp" class="weather-temp"></p>
            </div>
          </div>
        </div>

        <div id="guess-controls" class="guess-controls hidden">
          <button id="correct-guess-btn" class="answer-btn correct-btn" type="button">Correct</button>
          <button id="wrong-guess-btn" class="answer-btn wrong-btn" type="button">Wrong</button>
        </div>
      </section>
    </main>

    <script src="cities.js?v=1"></script>
    <script src="script.js?v=6"></script>
  </body>
</html>
