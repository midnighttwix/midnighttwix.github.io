<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Roulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="city-backdrop" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="site-header">
        <a class="back-link" href="../">Zane Games</a>
        <div class="round-counter" aria-live="polite"><span id="score">0</span><span class="counter-slash">/</span>3</div>
      </header>

      <section class="hero-copy">
        <p class="kicker">Somewhere on Earth</p>
        <h1>World Roulette</h1>
        <p class="intro">Spin into a city, take in the view, and trust your instincts.</p>
      </section>

      <section class="mode-picker" aria-label="Game mode">
        <button class="mode-card active" type="button" data-mode="weather" aria-pressed="true">
          <span class="mode-icon">☼</span>
          <span><strong>Weather</strong><small>What is happening outside?</small></span>
        </button>
        <button class="mode-card" type="button" data-mode="time" aria-pressed="false">
          <span class="mode-icon">◷</span>
          <span><strong>Time</strong><small>What time is it there?</small></span>
        </button>
        <button class="mode-card" type="button" data-mode="explore" aria-pressed="false">
          <span class="mode-icon">◎</span>
          <span><strong>Explore</strong><small>Take a free trip</small></span>
        </button>
      </section>

      <section class="roulette-stage">
        <div class="stage-topline"><span id="mode-label">WEATHER ROUND</span><span id="status-dot" class="status-dot"></span></div>
        <div id="status-message" class="status-message">Choose a mode, then spin the wheel.</div>
        <div id="place-card" class="place-card hidden">
          <div class="photo-frame">
            <img id="place-photo" alt="" />
            <div class="photo-shade"></div>
            <div class="place-caption"><p id="place-region"></p><h2 id="place-name"></h2></div>
          </div>
          <div class="facts-row">
            <div id="time-fact" class="fact"><span>Local time</span><strong id="place-time">--:--</strong></div>
            <div id="condition-fact" class="fact"><span>Conditions</span><strong id="weather-condition">--</strong></div>
            <div id="temperature-fact" class="fact"><span>Temperature</span><strong id="weather-temp">--</strong></div>
          </div>
        </div>
        <button id="randomize-btn" class="spin-button" type="button"><span>↻</span> Spin the world</button>
      </section>

      <section id="guess-panel" class="guess-panel hidden">
        <div class="guess-heading"><label id="guess-prompt" for="guess-input">Make your call</label><span>Answer</span></div>
        <form id="guess-form" class="guess-form">
          <input id="guess-input" name="guess" type="text" autocomplete="off" required />
          <button class="answer submit-answer" type="submit">Submit answer</button>
        </form>
      </section>

      <section id="history-panel" class="history-panel hidden"><div class="history-heading"><span>Trail of guesses</span><span id="history-count">0 rounds</span></div><div id="guess-history" class="guess-history"></div></section>
    </main>
    <script src="cities.js?v=2"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
