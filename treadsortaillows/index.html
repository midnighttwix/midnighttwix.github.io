<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treads or Taillows</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="back-link" href="../">&larr; Zane Games</a>
        <h1>TREADS <span class="or">or</span> TAILLOWS</h1>
        <p class="tagline">Iron Treads is heads. Taillow is tails. Call it in the air.</p>
      </header>

      <section class="panel">
        <div class="scoreboard">
          <div class="gauge">
            <p class="gauge-label">Called</p>
            <p id="score-display" class="gauge-value">0 / 10</p>
          </div>
          <div class="gauge">
            <p class="gauge-label">Streak</p>
            <p id="streak-display" class="gauge-value">0</p>
          </div>
          <div class="gauge">
            <p class="gauge-label">Flips</p>
            <p id="flips-display" class="gauge-value">0</p>
          </div>
        </div>

        <div class="coin-stage">
          <div id="coin" class="coin">
            <div class="face face-heads">
              <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/990.png"
                alt="Iron Treads"
              />
              <span>TREADS</span>
            </div>
            <div class="face face-tails">
              <img
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/276.png"
                alt="Taillow"
              />
              <span>TAILLOWS</span>
            </div>
          </div>
        </div>

        <div id="call-row" class="call-row">
          <button id="heads-btn" class="btn" type="button">Treads</button>
          <button id="tails-btn" class="btn btn-alt" type="button">Taillows</button>
        </div>

        <div id="penalty" class="penalty hidden">
          <p class="penalty-label">Bad call &mdash; next flip in</p>
          <p id="penalty-count" class="penalty-count">10</p>
        </div>

        <p id="feedback" class="feedback">Call it.</p>

        <div id="history" class="history"></div>
      </section>

      <section id="win-view" class="panel hidden">
        <h2>Congrats!</h2>
        <p id="win-note" class="win-note"></p>
        <div class="btn-row">
          <button id="play-again-btn" class="btn" type="button">Flip Again</button>
          <a class="btn btn-ghost" href="../">Back To Games</a>
        </div>
      </section>
    </div>

    <script src="script.js?v=1"></script>
  </body>
</html>
