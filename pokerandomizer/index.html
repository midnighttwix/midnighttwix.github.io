<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokerandomizer</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="dex-header">
          <span class="dex-light"></span>
          <span class="dex-light-small dex-light-yellow"></span>
          <span class="dex-light-small dex-light-green"></span>
        </div>

        <div class="dex-screen">
          <div class="topbar">
            <div>
              <p class="eyebrow">One-Stop Randomizer Shop</p>
              <h1 class="bold-title">Pokerandomizer</h1>
            </div>
          </div>

          <details id="controls-details" class="controls-details" open>
            <summary>Filters &amp; Display Options</summary>

            <form id="controls-form" class="controls-form">
            <div class="control-row">
              <label class="count-label" for="count-input">
                How many Pokémon?
                <input id="count-input" type="number" min="1" max="1025" value="6" />
              </label>

              <label class="theme-label" for="theme-select">
                Color theme
                <select id="theme-select"></select>
              </label>
            </div>

            <fieldset class="filter-group">
              <legend>Generations</legend>
              <div id="gen-filters" class="chip-row"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend>Types</legend>
              <div id="type-filters" class="chip-row"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend>Evolution stage</legend>
              <div id="stage-filters" class="chip-row">
                <label class="chip"><input type="checkbox" value="unevolved" /> Not fully evolved</label>
                <label class="chip"><input type="checkbox" value="evolved" /> Fully evolved</label>
              </div>
            </fieldset>

            <fieldset class="filter-group">
              <legend>Show on cards</legend>
              <div class="chip-row">
                <label class="chip"><input type="checkbox" id="toggle-image" checked /> Image</label>
                <label class="chip"><input type="checkbox" id="toggle-name" checked /> Name</label>
                <label class="chip"><input type="checkbox" id="toggle-types" checked /> Typings</label>
                <label class="chip"><input type="checkbox" id="toggle-dex" checked /> Dex #</label>
                <label class="chip"><input type="checkbox" id="toggle-stats" checked /> Height / Weight</label>
              </div>
            </fieldset>

              <button id="generate-btn" class="primary-btn" type="submit">Generate</button>
            </form>
          </details>

          <p id="status-message" class="status-message"></p>

          <div id="results-grid" class="results-grid"></div>
        </div>
      </section>
    </main>

    <script src="pokedata.js?v=1"></script>
    <script src="script.js?v=1"></script>
  </body>
</html>
