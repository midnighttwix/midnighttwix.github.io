<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avoid All Orthworms</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Click Anything Except Orthworm</p>
            <h1 class="bold-title">🪱 Avoid All Orthworms</h1>
          </div>
          <p id="timer-display" class="timer-display">6:00:00</p>
        </div>

        <p id="status-message" class="status-message">
          Get the timer down to zero. Clicking any Pok&eacute;mon that isn't Orthworm knocks 10 seconds
          off the clock. Clicking Orthworm resets the timer all the way back to 6 hours!
        </p>

        <div id="start-view" class="start-view">
          <button id="start-btn" class="primary-btn" type="button">Start</button>
        </div>

        <div id="game-view" class="game-view hidden">
          <div id="play-field" class="play-field"></div>
        </div>

        <div id="end-view" class="end-view hidden">
          <p id="end-message" class="end-message"></p>
          <button id="restart-btn" class="primary-btn" type="button">Play Again</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=1"></script>
  </body>
</html>
