<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pitter Pattern</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Memory Game</p>
            <h1 class="bold-title">🧠 Pitter Pattern</h1>
          </div>
          <button id="start-btn" class="primary-btn" type="button">Start</button>
        </div>

        <p id="status-message" class="status-message">
          Hit Start to memorize a sequence of 20 Pokémon, then recall them all in order.
        </p>

        <div id="memorize-view" class="memorize-view hidden">
          <p class="phase-label">Memorize this order, then hit "Start Guessing" when ready.</p>
          <div id="memorize-grid" class="memorize-grid"></div>
          <div class="phase-actions">
            <button id="start-guessing-btn" class="primary-btn" type="button">Start Guessing</button>
            <button id="start-over-btn-memorize" class="link-btn" type="button">Start Over</button>
          </div>
        </div>

        <div id="guess-view" class="guess-view hidden">
          <p id="guess-progress" class="guess-progress"></p>
          <div id="guess-history" class="guess-history"></div>
          <div class="guess-row">
            <input id="guess-input" type="text" placeholder="Type the next Pokémon's name" autocomplete="off" />
            <button id="submit-guess-btn" class="ghost-btn" type="button">Submit</button>
          </div>
          <button id="start-over-btn-guess" class="link-btn" type="button">Start Over</button>
        </div>

        <div id="end-view" class="end-view hidden">
          <p id="end-message" class="end-message"></p>
          <button id="restart-btn" class="primary-btn" type="button">Play Again</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=2"></script>
  </body>
</html>
