<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chain Reaction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">Chain Reaction</p>
            <h1 class="bold-title">C H A I N &nbsp; R E A C T I O N</h1>
          </div>
        </div>

        <div id="start-view" class="start-view">
          <button id="start-btn" class="primary-btn" type="button">Start</button>
        </div>

        <div id="game-view" class="game-view hidden">
          <div class="game-topbar">
            <p id="solved-count" class="solved-count">0 / 10 solved</p>
            <button id="give-up-btn" class="ghost-btn" type="button">New Game</button>
          </div>

          <div id="chain-board" class="chain-board"></div>

          <p id="lockout-message" class="lockout-message hidden"></p>

          <button id="guess-btn" class="primary-btn" type="button">Guess</button>
        </div>

        <div id="end-view" class="end-view hidden">
          <p id="end-message" class="end-message"></p>
          <button id="restart-btn" class="primary-btn" type="button">Play Again</button>
        </div>
      </section>
    </main>

    <script src="pokedata.js?v=1"></script>
    <script src="script.js?v=1"></script>
  </body>
</html>
