<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pok&eacute;mon Hangman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="back-link" href="../">&larr; Zane Games</a>
        <h1>Pok&eacute;mon Hangman</h1>
        <p class="tagline">Six wrong letters and it&rsquo;s over. Guess three Pok&eacute;mon to win.</p>
      </header>

      <section id="game-view" class="paper">
        <div class="scoreboard">
          <div class="gauge">
            <p class="gauge-label">Solved</p>
            <p id="score-display" class="gauge-value">0 / 3</p>
          </div>
          <div class="gauge">
            <p class="gauge-label">Misses</p>
            <p id="misses-display" class="gauge-value">0 / 6</p>
          </div>
          <div class="gauge">
            <p class="gauge-label">Hint</p>
            <p id="hint-display" class="gauge-value">&mdash;</p>
          </div>
        </div>

        <div class="board">
          <svg class="gallows" viewBox="0 0 160 200" aria-hidden="true">
            <line class="beam" x1="20" y1="190" x2="110" y2="190" />
            <line class="beam" x1="45" y1="190" x2="45" y2="16" />
            <line class="beam" x1="45" y1="16" x2="110" y2="16" />
            <line class="beam" x1="110" y1="16" x2="110" y2="40" />
            <circle id="part-head" class="part" cx="110" cy="56" r="16" />
            <line id="part-body" class="part" x1="110" y1="72" x2="110" y2="126" />
            <line id="part-arm-l" class="part" x1="110" y1="86" x2="86" y2="108" />
            <line id="part-arm-r" class="part" x1="110" y1="86" x2="134" y2="108" />
            <line id="part-leg-l" class="part" x1="110" y1="126" x2="88" y2="160" />
            <line id="part-leg-r" class="part" x1="110" y1="126" x2="132" y2="160" />
          </svg>

          <div class="word-side">
            <div id="word" class="word"></div>
            <p id="wrong-letters" class="wrong-letters"></p>
          </div>
        </div>

        <div id="keyboard" class="keyboard"></div>

        <div id="penalty" class="penalty hidden">
          <p class="penalty-label">Penalty</p>
          <p id="penalty-count" class="penalty-count">10</p>
        </div>

        <p id="feedback" class="feedback"></p>
      </section>

      <section id="win-view" class="paper hidden">
        <h2>Congrats!</h2>
        <p id="win-note" class="win-note"></p>
        <div class="btn-row">
          <button id="play-again-btn" class="btn" type="button">Play Again</button>
          <a class="btn btn-ghost" href="../">Back To Games</a>
        </div>
      </section>
    </div>

    <script src="pokedata.js"></script>
    <script src="script.js?v=1"></script>
  </body>
</html>
