<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rap God</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <div class="topbar">
          <div>
            <p class="eyebrow">151 Original Pok&eacute;mon, In Order</p>
            <h1 class="bold-title">RAP GOD</h1>
          </div>
        </div>

        <div id="study-view" class="study-view">
          <p class="phase-label">
            Study the order below, then hit ready when you feel confident you've got it memorized.
          </p>
          <div id="study-list" class="study-list"></div>
          <button id="ready-btn" class="primary-btn" type="button">I'm Ready!</button>
        </div>

        <div id="quiz-view" class="quiz-view hidden">
          <p class="phase-label">Who comes directly after this Pok&eacute;mon in the rap?</p>

          <div class="pokemon-display">
            <img id="pokemon-img" class="pokemon-img" src="" alt="" />
            <p id="pokemon-name" class="pokemon-name"></p>
          </div>

          <div class="guess-row">
            <div class="guess-input-wrap">
              <input id="guess-input" type="text" placeholder="Type the next Pok&eacute;mon..." autocomplete="off" />
              <div id="suggestions" class="suggestions hidden"></div>
            </div>
            <button id="submit-guess-btn" class="ghost-btn" type="button">Guess</button>
          </div>

          <p id="result-message" class="result-message"></p>

          <div id="result-actions" class="result-actions hidden">
            <button id="study-again-btn" class="primary-btn hidden" type="button">Back to Studying</button>
            <button id="play-again-btn" class="primary-btn hidden" type="button">Play Again</button>
          </div>
        </div>
      </section>
    </main>

    <script src="pokerap-order.js?v=1"></script>
    <script src="script.js?v=1"></script>
  </body>
</html>
